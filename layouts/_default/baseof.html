<!DOCTYPE html>
<html lang="zh-tw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-green: #3fb950;
      --accent-orange: #d29922;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ── */
    .site-header {
      background: linear-gradient(135deg, #1a2332 0%, #0d1117 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 48px 24px 40px;
      text-align: center;
    }
    .site-header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .site-header .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 400;
    }
    .site-header .divider {
      width: 60px;
      height: 3px;
      background: var(--accent);
      margin: 20px auto 0;
      border-radius: 2px;
    }

    /* ── Main content ── */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* ── Section title ── */
    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 20px;
      padding-left: 4px;
    }

    /* ── Chapter grid ── */
    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .chapter-card {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px 22px 22px;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .chapter-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .chapter-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .chapter-card:hover::before { opacity: 1; }

    .ch-num {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .ch-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .ch-title-en {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 10px;
    }
    .ch-pages {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* ── About section ── */
    .about-section {
      margin-top: 48px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 28px 32px;
    }
    .about-section h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }
    .about-section p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .about-section p:last-child { margin-bottom: 0; }

    /* ── Standard content ── */
    h1 { color: #fff; font-size: 1.8rem; margin-bottom: 12px; }
    h2 { color: #e6edf3; margin-top: 36px; margin-bottom: 14px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; font-size: 1.3rem; }
    h3 { color: #e6edf3; margin-top: 24px; margin-bottom: 10px; font-size: 1.1rem; }
    p { margin-bottom: 14px; color: var(--text); }
    strong { color: #79c0ff; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    blockquote {
      background: #0d1f0d;
      border-left: 4px solid var(--accent-green);
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 0 6px 6px 0;
    }
    blockquote p { margin-bottom: 8px; color: #b0d4a8; }
    blockquote p:last-child { margin-bottom: 0; }
    ul, ol { margin: 12px 0 14px 20px; color: var(--text); }
    li { margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.88rem; }
    th { background: #1c2128; color: #e6edf3; padding: 8px 12px; text-align: left; border: 1px solid var(--card-border); }
    td { padding: 8px 12px; border: 1px solid var(--card-border); color: var(--text); }
    tr:nth-child(even) td { background: #161b22; }
    hr { border: none; border-top: 1px solid var(--card-border); margin: 24px 0; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .site-header h1 { font-size: 1.6rem; }
      .chapter-grid { grid-template-columns: 1fr; }
      .container { padding: 24px 16px 40px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>Gray's Anatomy for Students</h1>
    <p class="subtitle">3rd Edition &nbsp;&middot;&nbsp; Drake, Vagi &amp; Mitchell</p>
    <div class="divider"></div>
  </header>

  <main class="container">
    {{ .Content }}
  </main>
</body>
</html>

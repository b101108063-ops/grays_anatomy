<!DOCTYPE html>
<html lang="zh-tw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; background: #1a1a1a; color: #e0e0e0; }
    h1 { color: #fff; border-bottom: 2px solid #58a6ff; padding-bottom: 10px; }
    h2 { color: #e6edf3; margin-top: 40px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
    h3 { color: #e6edf3; margin-top: 30px; }
    p { margin-bottom: 16px; }
    strong { color: #79c0ff; }
    blockquote { background: #0d1f0d; border-left: 4px solid #2ea043; padding: 12px 16px; margin: 16px 0; }
    blockquote p { margin-bottom: 8px; color: #b0d4a8; }
    code { background: #2d333b; padding: 2px 6px; border-radius: 4px; }
    pre { background: #2d333b; padding: 16px; border-radius: 8px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border: 1px solid #30363d; padding: 8px 12px; text-align: left; }
    th { background: #21262d; }
    a { color: #58a6ff; }
    .clinical { background: #0d1f0d; border: 1px solid #2ea043; border-radius: 6px; padding: 16px; margin: 20px 0; }
    .clinical-title { color: #2ea043; font-weight: bold; text-transform: uppercase; margin-bottom: 12px; }
  </style>
</head>
<body>
  <article>
    {{ .Content }}
  </article>
</body>
</html>
